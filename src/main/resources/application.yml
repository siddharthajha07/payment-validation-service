spring:
  application:
    name: payment-validation-service

  datasource:
    # In-memory H2. DB_CLOSE_DELAY=-1 keeps the database alive for the lifetime of
    # the JVM rather than dropping it when the last connection closes.
    url: jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      # The schema is created from the entity definitions at startup. Acceptable for an
      # embedded database; a production deployment would use versioned migrations
      # (Flyway or Liquibase) so the schema is reviewable and repeatable.
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      # Browsable at http://localhost:8080/h2-console for demonstration and troubleshooting.
      enabled: true
      path: /h2-console

server:
  port: 8080
  error:
    # Never expose stack traces or internal messages to callers; the global exception
    # handler returns a controlled error document instead.
    include-message: never
    include-stacktrace: never

logging:
  level:
    root: INFO
    com.rbc.paymentvalidation: DEBUG

payment:
  xml:
    # Upper bound on an inbound payload, checked before parsing so that an oversized body
    # is never expanded in memory. One megabyte comfortably exceeds a realistic pacs.008
    # while leaving no room for a resource-exhaustion attempt.
    max-payload-bytes: 1048576

  validation:
    # The only currency this deployment settles, matching the clearing system in the
    # supplied samples.
    supported-currency: BBD
    # Decimal places permitted on a settlement amount.
    max-fraction-digits: 2
    # Digits required in a branch transit identifier. The assessment specifies three; the
    # supplied sample carries five (05605), so the sample fails this rule as written. Held
    # in configuration so the conflict can be resolved without a code change. See
    # ASSUMPTIONS.md.
    transit-number-length: 3
    # How far ahead a settlement date may be dated.
    max-future-settlement-days: 2

  signing:
    # A self-signed, test-only key pair, committed so the service runs straight from a
    # clone. Production would hold the private key in an HSM or a secrets manager and use
    # a certificate issued by a CA the counterparty trusts. See ASSUMPTIONS.md.
    keystore-location: keystore/signing-keystore.p12
    keystore-password: changeit
    key-alias: payment-signing
    key-password: changeit
